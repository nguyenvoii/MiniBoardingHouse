<!doctype html>
<html lang="vi" class="legal-page" data-document="{{kind}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c2e">
  <title>{{title}} | Stayly</title>
  <meta name="description" content="{{title}} của Stayly, phần mềm quản lý nhà trọ.">
  <link rel="icon" href="/assets/stayly-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/stayly-legal.css">
  <script src="/assets/stayly-legal.js" defer></script>
</head>
<body id="dau-trang">
  <a class="legal-skip" href="#noi-dung">Bỏ qua đến nội dung</a>
  <header class="legal-header">
    <div class="legal-wrap legal-header-inner">
      <a class="legal-brand" href="/" aria-label="Stayly, trang chủ"><img src="/assets/stayly-mark.svg" width="32" height="32" alt="">Stayly</a>
      <a class="legal-home-link" href="/"><span aria-hidden="true"></span>Trang chủ</a>
    </div>
    <div class="legal-progress" aria-hidden="true"></div>
  </header>

  <main id="noi-dung" tabindex="-1">
    <div class="legal-hero">
      <div class="legal-wrap legal-hero-inner">
        <div class="legal-hero-copy">
          <h1 data-enter>{{title}}</h1>
          <p class="legal-effective" data-enter><time datetime="2026-11-28">Có hiệu lực từ 28/11/2026</time><span>Áp dụng cho dịch vụ Stayly tại stayly.io.vn.</span></p>
        </div>
        <div class="legal-hero-route" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>

    <div class="legal-wrap legal-reading">
      <aside class="legal-index">
        <details open>
          <summary>Mục lục</summary>
          <nav aria-label="Mục lục" class="legal-contents">
            <ol>{{contents}}</ol>
          </nav>
        </details>
      </aside>
      <article class="legal-article" aria-label="{{title}}">
        {{body}}
        <a class="legal-top-link" href="#dau-trang">Về đầu trang <span aria-hidden="true"></span></a>
      </article>
    </div>
  </main>

  <footer class="legal-footer">
    <div class="legal-wrap">
      <div class="legal-footer-main">
        <a class="legal-brand" href="/" aria-label="Stayly, trang chủ"><img src="/assets/stayly-mark.svg" width="32" height="32" alt="">Stayly</a>
        <nav aria-label="Thông tin pháp lý và liên hệ">{{nav}}</nav>
      </div>
      <div class="legal-footer-owner">{{owner}}</div>
    </div>
  </footer>
</body>
</html>
