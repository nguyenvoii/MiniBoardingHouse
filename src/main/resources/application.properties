spring.application.name=MiniBoardingHouse

# SQL Server local - moi nguoi sua user/password trong application-local.properties (khong commit)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MiniBoardingHouseDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=

# validate: Hibernate so entity voi DB that, lech la bao loi luc khoi dong
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT (chi dung dev). Muon doi bi mat: dat app.jwt.secret trong application-local.properties (>= 32 ky tu)
app.jwt.secret=dev-only-secret-minihouse-group7-change-me-2026
app.jwt.expiration-minutes=480

# Da tu lam dang nhap JWT, tat tai khoan mac dinh "generated security password" cua Spring
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.config.import=optional:classpath:application-local.properties
