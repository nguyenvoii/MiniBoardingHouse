spring.application.name=MiniBoardingHouse

# SQL Server local - moi nguoi sua user/password trong application-local.properties (khong commit)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MiniBoardingHouseDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=

# validate: Hibernate so entity voi DB that, lech la bao loi luc khoi dong
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.config.import=optional:classpath:application-local.properties
