spring.application.name=MiniBoardingHouse

# SQL Server local - moi nguoi sua user/password trong application-local.properties (khong commit)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MiniBoardingHouseDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=

# validate: Hibernate so entity voi DB that, lech la bao loi luc khoi dong
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Cong tac bat buoc dang nhap. false = mo het (dong doi test khong can token), true = bat buoc token + @PreAuthorize.
# Muon bat tren may minh: dat app.security.enabled=true trong application-local.properties
app.security.enabled=false

# JWT (chi dung dev). Muon doi bi mat: dat app.jwt.secret trong application-local.properties (>= 32 ky tu)
app.jwt.secret=dev-only-secret-minihouse-group7-change-me-2026
app.jwt.expiration-minutes=480

# Da tu lam dang nhap JWT, tat tai khoan mac dinh "generated security password" cua Spring
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Thu muc luu file upload (anh dai dien...), tuong doi theo thu muc chay app. Gioi han 1 file 5 MB
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.config.import=optional:classpath:application-local.properties

# Nen JS/CSS/JSON de giao dien tai nhanh hon
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# In ca noi dung thong bao gia lap (ma OTP, mat khau tam) ra log o muc INFO. true = tien cho dev/demo. Dat false khi chay that.
app.notification.log-otp=true


# SMTP is opt-in. Set spring.mail.host, credentials/TLS as required by the SMTP provider, and app.mail.from.
app.mail.enabled=false
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# SMS (Twilio) is opt-in. Bat: app.sms.enabled=true + app.sms.twilio.account-sid, app.sms.twilio.auth-token, app.sms.twilio.from
# (bien APP_SMS_ENABLED, APP_SMS_TWILIO_ACCOUNT_SID, APP_SMS_TWILIO_AUTH_TOKEN, APP_SMS_TWILIO_FROM; xem docs/HUONG_DAN_SMS_TWILIO.md).
# app.sms.twilio.base-url chi de thu voi may chu gia, mac dinh https://api.twilio.com/2010-04-01.
app.sms.enabled=false
# SMS qua SpeedSMS (https://speedsms.vn): app.sms.speedsms.enabled=true + app.sms.speedsms.access-token (lay o connect.speedsms.vn).
# type 4 = brandname co san Verify/Notify (khong can dang ky brandname). Xem docs/HUONG_DAN_SMS_SPEEDSMS.md.
app.sms.speedsms.enabled=false
app.sms.speedsms.access-token=
app.sms.speedsms.type=4
app.sms.speedsms.sender=
# true: nguoi dung nhap SO DIEN THOAI o man quen mat khau thi ma gui bang SMS (SpeedSMS hoac Twilio, can bat mot trong hai); mac dinh gui email.
app.otp.sms-on-phone=false

# Set app.payment.payos.client-id, api-key, checksum-key, return-url and cancel-url to enable checkout.
app.payment.payos.enabled=false

# SePay: tien chuyen khoan ve thi SePay goi webhook /api/payments/sepay-webhook, app tu gach hoa don.
# Bat: app.payment.sepay.enabled=true va dat app.payment.sepay.api-key (bien APP_PAYMENT_SEPAY_API_KEY, >= 32 ky tu ngau nhien),
# cung khoa do cau hinh o SePay (Webhooks, kieu chung thuc API Key). Bat thi QR thanh toan la QR dong cua SePay.
app.payment.sepay.enabled=false
app.payment.sepay.api-key=

# OTP qua Zalo (eOTP, https://eotp.com.vn/docs/): local = app tu sinh ma va gui EMAIL (mac dinh);
# eotp = nguoi dung nhap SO DIEN THOAI thi ma gui qua Zalo, nhap email thi van gui email. Bat eotp thi bat buoc co api-key + api-secret.
# Chay that: dat bien APP_OTP_PROVIDER=eotp, APP_OTP_EOTP_API_KEY, APP_OTP_EOTP_API_SECRET (xem docs/HUONG_DAN_EOTP.md).
app.otp.provider=local
app.otp.eotp.base-url=https://eotp.com.vn/api/v1
app.otp.eotp.api-key=
app.otp.eotp.api-secret=
app.otp.eotp.channel=zalo

# Don vi chiu trach nhiem hien CONG KHAI o chan trang chu va cac trang /privacy /terms /pricing /contact.
# Dat bang bien moi truong tren server (APP_PUBLIC_OWNER_NAME, APP_PUBLIC_OWNER_EMAIL, APP_PUBLIC_OWNER_PHONE, APP_PUBLIC_OWNER_ADDRESS);
# KHONG ghi gia tri that vao file nay vi repo la cong khai.
app.public.owner-name=
app.public.owner-email=
app.public.owner-phone=
app.public.owner-address=
