name: Deploy (Docker -> CapRover)

on:
  push:
    branches: [main]
  workflow_dispatch:        # cho phép bấm tay trong tab Actions

permissions:
  contents: read
  packages: write           # cho phép đẩy image lên GHCR bằng GITHUB_TOKEN

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Thiếu secret thì action CapRover vẫn báo "xanh" dù không deploy được gì (nó hỏi mật khẩu rồi thoát): chặn sớm, báo rõ
      - name: Kiểm tra 3 secret CapRover
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          for name in CAPROVER_SERVER APP_NAME APP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Thiếu GitHub Secret $name (repo > Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          [ -z "$missing" ] || exit 1

      - uses: actions/checkout@v4

      # GHCR yêu cầu tên image viết thường
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.APP_NAME }}
          token: '${{ secrets.APP_TOKEN }}'
          image: ${{ env.IMAGE }}:latest
