name: Deploy (Docker -> CapRover)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Triển khai lên CapRover sau khi kiểm thử
        type: boolean
        default: false
      dependency_scan:
        description: Chạy OWASP Dependency-Check
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run tests
        run: mvn -B -Psql-integration verify
      - name: Check Maven dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.dependency_scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=()
          if [ -n "$NVD_API_KEY" ]; then
            args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          fi
          mvn -B "${args[@]}" org.owasp:dependency-check-maven:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/dependency-check-report.*

  build-and-deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Thiếu secret thì action CapRover vẫn báo "xanh" dù không deploy được gì (nó hỏi mật khẩu rồi thoát): chặn sớm, báo rõ
      - name: Kiểm tra 3 secret CapRover
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          for name in CAPROVER_SERVER APP_NAME APP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Thiếu GitHub Secret $name (repo > Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          [ -z "$missing" ] || exit 1

      - uses: actions/checkout@v4

      # GHCR yêu cầu tên image viết thường
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.APP_NAME }}
          token: '${{ secrets.APP_TOKEN }}'
          image: ${{ env.IMAGE }}:sha-${{ github.sha }}
